<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
body{
    font-family: Arial;
    text-align:center;
}

input{
    width:80%;
    padding:10px;
    margin:5px;
}

button{
    padding:15px;
    width:80%;
}
</style>
</head>

<body>

<h3>DIÁRIAS</h3>
<input type="number" id="diarias">

<h3>ALUGUEL</h3>
<input type="number" id="aluguel">

<h3>KM</h3>
<input type="number" id="km">

<h3>PEDÁGIO</h3>
<input type="number" id="ped">

<button onclick="calc()">CALCULAR</button>

<script>
function calc(){

let base = JSON.parse(localStorage.getItem("dados"));

let qtdDiarias = Number(diarias.value || 0);
let qtdAluguel = Number(aluguel.value || 0);
let km = Number(km.value || 0);
let ped = Number(ped.value || 0);

// cálculos
let totalDiarias = qtdDiarias * 180;
let totalAluguel = qtdAluguel * 100;
let totalDeslocamento = km * 2;
let totalPed = ped;

localStorage.setItem("resultado", JSON.stringify({
...base,
qtdDiarias,
qtdAluguel,
km,
totalDiarias,
totalAluguel,
totalDeslocamento,
totalPed
}));

location = "resultado.html";
}
</script>

</body>
</html>
