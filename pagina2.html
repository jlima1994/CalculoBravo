<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERVIÇOS</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    padding:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #444;
    padding:10px;
    text-align:center;
}

input{
    width:80px;
    padding:5px;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#00c853;
    border:none;
    color:#fff;
}
</style>
</head>

<body>

<table>
<thead>
<tr>
<th>KM</th>
<th>PEDÁGIOS</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<button onclick="calcular()">CALCULAR</button>

<script>

let qtd = Number(localStorage.getItem("qtdServicos"));

let tabela = document.getElementById("tabela");

for(let i=0;i<qtd;i++){
tabela.innerHTML += `
<tr>
<td><input type="number" class="km"></td>
<td><input type="number" class="pedagio"></td>
</tr>`;
}

function calcular(){

let kms = document.querySelectorAll(".km");
let pedagios = document.querySelectorAll(".pedagio");

let totalKm = 0;
let totalPedagio = 0;

for(let i=0;i<kms.length;i++){
totalKm += Number(kms[i].value) || 0;
totalPedagio += Number(pedagios[i].value) || 0;
}

let deslocamento = totalKm * 0.68;
let diarias = qtd * 190;
let aluguel = qtd * 49.50;

let totalFinal = deslocamento + totalPedagio + diarias + aluguel;

localStorage.setItem("totalKm", totalKm);
localStorage.setItem("deslocamento", deslocamento);
localStorage.setItem("pedagios", totalPedagio);
localStorage.setItem("diarias", diarias);
localStorage.setItem("aluguel", aluguel);
localStorage.setItem("totalFinal", totalFinal);

window.location.href = "resultado.html";
}
</script>

</body>
</html>
