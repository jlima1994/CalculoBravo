<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dados Motorista</title>
</head>

<body>

<h3>Quantidade de Diárias</h3>
<input type="number" id="diarias">

<h3>Quantidade de Aluguel</h3>
<input type="number" id="aluguel">

<h3>KM Rodado</h3>
<input type="number" id="km">

<h3>Pedágio (R$)</h3>
<input type="number" id="ped">

<br><br>
<button onclick="calcular()">Calcular</button>

<script>
function calcular(){

let base = JSON.parse(localStorage.getItem("dados"));

let qtdDiarias = Number(document.getElementById("diarias").value || 0);
let qtdAluguel = Number(document.getElementById("aluguel").value || 0);
let km = Number(document.getElementById("km").value || 0);
let pedagio = Number(document.getElementById("ped").value || 0);

// cálculos
let totalDiarias = qtdDiarias * 180;
let totalAluguel = qtdAluguel * 100;
let totalDeslocamento = km * 2;
let totalPed = pedagio;

localStorage.setItem("resultado", JSON.stringify({
...base,
qtdDiarias,
qtdAluguel,
km,
totalDiarias,
totalAluguel,
totalDeslocamento,
totalPed
}));

window.location.href = "resultado.html";
}
</script>

</body>
</html>
