<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: monospace;
background:#000;
color:#0f0;
padding:20px;
}
input, button{
width:100%;
padding:15px;
margin-top:10px;
font-size:18px;
}
</style>
</head>

<body>

<h2>DIÁRIAS</h2>
<input type="number" id="diarias">

<h2>ALUGUEL</h2>
<input type="number" id="aluguel">

<h2>KM TOTAL</h2>
<input type="number" id="km">

<h2>PEDÁGIO</h2>
<input type="number" id="ped">

<button onclick="calc()">CALCULAR</button>

<script>
function calc(){

let dados = JSON.parse(localStorage.getItem("dados"));

let qtd = Number(diarias.value);
let aluguel = Number(aluguel.value);
let km = Number(km.value);
let ped = Number(ped.value);

let totalDiarias = qtd * 180;
let totalAluguel = aluguel * 100;
let totalDeslocamento = km * 2;
let totalPed = ped;

localStorage.setItem("resultado", JSON.stringify({
...dados,
qtd,
totalKm: km,
totalDiarias,
totalAluguel,
totalDeslocamento,
totalPed
}));

window.location = "resultado.html";
}
</script>

</body>
</html>
