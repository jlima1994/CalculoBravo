<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PÁGINA 2</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:15px;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #555;
    padding:10px;
    text-align:center;
    white-space:nowrap; /* 🔥 NÃO QUEBRA LINHA */
}

th{
    background:#222;
}

input{
    width:90px;
    padding:5px;
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#00c853;
    border:none;
    color:#fff;
    font-size:16px;
}
</style>
</head>

<body>

<h1>SERVIÇOS</h1>

<table>
    <thead>
        <tr>
            <th>PEDÁGIOS</th>
            <th>KM</th>
        </tr>
    </thead>
    <tbody id="corpoTabela"></tbody>
</table>

<button onclick="calcular()">CALCULAR</button>

<script>

// 🔥 QUANTIDADE VEM DA INDEX
let qtd = Number(localStorage.getItem("qtdServicos"));

if(!qtd){
    alert("ERRO - VOLTE PARA O INÍCIO");
    window.location.href = "index.html";
}

// 🔥 CRIAR LINHAS
let corpo = document.getElementById("corpoTabela");

for(let i=0; i<qtd; i++){
    corpo.innerHTML += `
    <tr>
        <td><input type="number" step="0.01" class="pedagio"></td>
        <td><input type="number" step="0.01" class="km"></td>
    </tr>
    `;
}

// 🔥 CALCULAR
function calcular(){

    let pedagios = document.querySelectorAll(".pedagio");
    let kms = document.querySelectorAll(".km");

    let totalPedagio = 0;
    let totalKm = 0;

    for(let i=0; i<pedagios.length; i++){
        totalPedagio += Number(pedagios[i].value) || 0;
        totalKm += Number(kms[i].value) || 0;
    }

    let valorKm = totalKm * 0.68;
    let qtdServicos = qtd;

    let diarias = qtdServicos * 190;
    let aluguel = qtdServicos * 49.50;

    let totalFinal = totalPedagio + valorKm + diarias + aluguel;

    // 🔥 SALVAR TUDO
    localStorage.setItem("totalPedagio", totalPedagio);
    localStorage.setItem("totalKm", totalKm);
    localStorage.setItem("valorKm", valorKm);
    localStorage.setItem("diarias", diarias);
    localStorage.setItem("aluguel", aluguel);
    localStorage.setItem("totalFinal", totalFinal);

    // IR PARA RESULTADO
    window.location.href = "resultado.html";
}

</script>

</body>
</html>
