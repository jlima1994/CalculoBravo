<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dados Motorista</title>

<style>
body {
    font-family: Arial;
    text-align: center;
}

.container {
    margin-top: 30px;
}

.linha {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 5px;
}

input {
    width: 100px;
    padding: 5px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
}
</style>

<script>
function gerarCampos() {
    let qtd = localStorage.getItem("qtd");
    let area = document.getElementById("campos");

    for (let i = 0; i < qtd; i++) {
        area.innerHTML += `
        <div class="linha">
            <input type="number" placeholder="Pedágio R$" id="ped${i}">
            <input type="number" placeholder="KM" id="km${i}">
        </div>`;
    }
}

function calcular() {
    let qtd = localStorage.getItem("qtd");
    let totalPed = 0;
    let totalKm = 0;

    for (let i = 0; i < qtd; i++) {
        totalPed += Number(document.getElementById("ped"+i).value) || 0;
        totalKm += Number(document.getElementById("km"+i).value) || 0;
    }

    localStorage.setItem("pedagio", totalPed);
    localStorage.setItem("km", totalKm);

    window.location.href = "resultado.html";
}

window.onload = gerarCampos;
</script>

</head>
<body>

<h2>LANÇAMENTOS</h2>

<div id="campos" class="container"></div>

<button onclick="calcular()">Calcular</button>

</body>
</html>
