<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PREENCHIMENTO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    padding: 10px;
}

/* CONTAINER PADRÃO */
.box, .container {
    width: 100%;
    max-width: 420px;
    margin: auto;
    text-align: center;
}

/* INPUTS E SELECT */
select, input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    font-size: 16px;
}

/* BOTÃO */
button {
    background: #00c853;
    border: none;
    color: white;
}

/* TABELA */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th {
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid #444;
}

td {
    padding: 8px;
}

/* ALINHAMENTOS */
.desc {
    text-align: left;
    white-space: nowrap;
}

.valor {
    text-align: right;
    white-space: nowrap;
}

/* INPUT NUMÉRICO */
input {
    text-align: right;
}
</style>
</head>

<body>

<div class="box">

<h2>PREENCHER DADOS</h2>

<table>
<thead>
<tr>
<th>PEDÁGIOS</th>
<th>KM</th>
</tr>
</thead>

<tbody id="linhas"></tbody>

</table>

<button onclick="enviar()">CALCULAR</button>

</div>

<script>
const qtd = parseInt(localStorage.getItem("qtd")) || 0;
const container = document.getElementById("linhas");

// cria linhas
for (let i = 0; i < qtd; i++) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td><input type="number" step="0.01" class="pedagio" placeholder="0.00"></td>
        <td><input type="number" step="0.01" class="km" placeholder="0.00"></td>
    `;

    container.appendChild(tr);
}

// cálculo
function enviar() {
    let totalPedagio = 0;
    let totalKm = 0;

    document.querySelectorAll(".pedagio").forEach(el => {
        totalPedagio += parseFloat(el.value) || 0;
    });

    document.querySelectorAll(".km").forEach(el => {
        totalKm += parseFloat(el.value) || 0;
    });

    const qtdServ = parseInt(localStorage.getItem("qtd")) || 0;

    const pedagios = totalPedagio;
    const deslocamento = totalKm * 0.68;
    const diarias = qtdServ * 190;
    const aluguel = qtdServ * 49.5;

    // salva
    localStorage.setItem("pedagios", pedagios.toFixed(2));
    localStorage.setItem("km", deslocamento.toFixed(2));
    localStorage.setItem("diarias", diarias.toFixed(2));
    localStorage.setItem("aluguel", aluguel.toFixed(2));

    window.location.href = "resultados.html";
}
</script>

</body>
</html>
