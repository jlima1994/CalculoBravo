<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Resultado Final</title>

<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
}

.container {
    margin-top: 40px;
    width: 360px;
    text-transform: uppercase;
}

h3 {
    text-align: center;
    margin-bottom: 20px;
}

/* Cabeçalho da tabela */
.header {
    display: flex;
    font-weight: bold;
    border-bottom: 2px solid #000;
    padding-bottom: 5px;
    margin-bottom: 10px;
}

.linha {
    display: flex;
    margin: 6px 0;
}

.valor {
    width: 40%;
    text-align: right;
    padding-right: 10px;
    white-space: nowrap;
}

.desc {
    width: 60%;
    text-align: left;
    padding-left: 10px;
    white-space: nowrap;
}

/* Destaque total */
.total {
    font-weight: bold;
}
</style>

<script>
function formatar(v){
    return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function proximoMes(mes){
    const meses = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO",
                   "JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
    let i = meses.indexOf(mes.toUpperCase());
    return meses[(i + 1) % 12];
}

function carregar(){

    let mes = (localStorage.getItem("mes") || "").toUpperCase();
    let q = localStorage.getItem("quinzena");

    let d = Number(localStorage.getItem("totalDiarias")) || 0;
    let a = Number(localStorage.getItem("totalAluguel")) || 0;
    let km = Number(localStorage.getItem("totalKm")) || 0;
    let des = Number(localStorage.getItem("totalDeslocamento")) || 0;
    let ped = Number(localStorage.getItem("totalPedagios")) || 0;

    let total = d + a + des + ped;

    let dataPagamento = q === "PrimeiraQuinzena"
        ? `10 DE ${proximoMes(mes)}`
        : `25 DE ${proximoMes(mes)}`;

    let html = `<div class="container">`;

    /* CABEÇALHO PRINCIPAL */
    html += `<h3>RECEBERÁ ${formatar(total)} EM ${dataPagamento}</h3>`;

    /* CABEÇALHO TABELA */
    html += `
    <div class="header">
        <div class="valor">VALORES</div>
        <div class="desc">DESCRIÇÃO</div>
    </div>
    `;

    /* LINHAS */
    html += `<div class="linha"><div class="valor">${formatar(d)}</div><div class="desc">DIÁRIAS</div></div>`;
    html += `<div class="linha"><div class="valor">${formatar(a)}</div><div class="desc">ALUGUEL</div></div>`;
    html += `<div class="linha"><div class="valor">${formatar(des)}</div><div class="desc">DESLOCAMENTO (${km} KM)</div></div>`;
    html += `<div class="linha"><div class="valor">${formatar(ped)}</div><div class="desc">PEDÁGIOS</div></div>`;

    html += `<hr>`;

    /* TOTAL */
    html += `<div class="linha total"><div class="valor">${formatar(total)}</div><div class="desc">TOTAL</div></div>`;

    html += `</div>`;

    document.body.innerHTML = html;
}

window.onload = carregar;
</script>

</head>
<body>
</body>
</html>
