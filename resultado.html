<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Resultado Final</title>

<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
}

.container {
    margin-top: 40px;
    width: 340px;
}

.linha {
    display: flex;
    justify-content: space-between;
    margin: 6px 0;
}

.valor, .desc {
    width: 50%;
    text-align: center;
}
</style>

<script>
function formatar(v){
    return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function proximoMes(mes){
    const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
                   "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    let i = meses.indexOf(mes);
    return meses[(i + 1) % 12];
}

function carregar(){

    let mes = localStorage.getItem("mes");
    let q = localStorage.getItem("quinzena");

    let d = Number(localStorage.getItem("totalDiarias")) || 0;
    let a = Number(localStorage.getItem("totalAluguel")) || 0;
    let km = Number(localStorage.getItem("totalKm")) || 0;
    let des = Number(localStorage.getItem("totalDeslocamento")) || 0;
    let ped = Number(localStorage.getItem("totalPedagios")) || 0;

    let total = d + a + des + ped;

    let dataPagamento = q === "PrimeiraQuinzena"
        ? `Receber em: 10 de ${proximoMes(mes)}`
        : `Receber em: 25 de ${proximoMes(mes)}`;

    let html = `<div class="container">`;

    html += `<h3>${dataPagamento}</h3>`;

    html += `<div class="linha"><div class="valor">${formatar(d)}</div><div class="desc">Total Diárias</div></div>`;
    html += `<div class="linha"><div class="valor">${formatar(a)}</div><div class="desc">Total Aluguel</div></div>`;
    html += `<div class="linha"><div class="valor">${formatar(des)}</div><div class="desc">Total Deslocamento (${km} KM)</div></div>`;
    html += `<div class="linha"><div class="valor">${formatar(ped)}</div><div class="desc">Total Pedágios</div></div>`;

    html += `<hr>`;

    html += `<div class="linha"><div class="valor"><strong>${formatar(total)}</strong></div><div class="desc"><strong>Total</strong></div></div>`;

    html += `</div>`;

    document.body.innerHTML = html;
}

window.onload = carregar;
</script>

</head>
<body>
</body>
</html>
