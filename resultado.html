<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESULTADO</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#00c853;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #555;
    padding:12px;
}

th{
    background:#222;
    text-align:center;
}

td.descricao{
    text-align:left;
}

td.valor{
    text-align:right;
    white-space:nowrap;
}

</style>
</head>

<body>

<h1>RESULTADO</h1>

<h2 id="cabecalho"></h2>

<table>
    <thead>
        <tr>
            <th>VALORES</th>
            <th>TOTAL</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="descricao">PEDÁGIOS</td>
            <td class="valor" id="pedagio"></td>
        </tr>
        <tr>
            <td class="descricao">KM</td>
            <td class="valor" id="km"></td>
        </tr>
        <tr>
            <td class="descricao">DIÁRIAS</td>
            <td class="valor" id="diarias"></td>
        </tr>
        <tr>
            <td class="descricao">ALUGUEL</td>
            <td class="valor" id="aluguel"></td>
        </tr>
    </tbody>
</table>

<script>

// 🔥 PEGAR DADOS
let totalPedagio = Number(localStorage.getItem("totalPedagio")) || 0;
let valorKm = Number(localStorage.getItem("valorKm")) || 0;
let diarias = Number(localStorage.getItem("diarias")) || 0;
let aluguel = Number(localStorage.getItem("aluguel")) || 0;
let totalFinal = Number(localStorage.getItem("totalFinal")) || 0;

// 🔥 FORMATAR EM REAL
function formatar(valor){
    return "R$ " + valor.toFixed(2).replace(".", ",");
}

// 🔥 MOSTRAR NA TELA
document.getElementById("pedagio").innerText = formatar(totalPedagio);
document.getElementById("km").innerText = formatar(valorKm);
document.getElementById("diarias").innerText = formatar(diarias);
document.getElementById("aluguel").innerText = formatar(aluguel);

// 🔥 CABEÇALHO
document.getElementById("cabecalho").innerText =
"RECEBERÁ " + formatar(totalFinal) + " EM REGRA DO MÊS SEGUINTE";

</script>

</body>
</html>
