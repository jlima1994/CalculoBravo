<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Resultado Final</title>

<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
}

.container {
    margin-top: 40px;
    width: 300px;
}

.linha {
    display: flex;
    justify-content: space-between;
    margin: 6px 0;
}

.desc {
    text-align: left;
}

.valor {
    text-align: right;
    min-width: 120px;
}
</style>

<script>
function formatar(v){
    return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function carregar(){

    let q = localStorage.getItem("quinzena");

    let d = Number(localStorage.getItem("totalDiarias")) || 0;
    let a = Number(localStorage.getItem("totalAluguel")) || 0;
    let km = Number(localStorage.getItem("totalKm")) || 0;
    let des = Number(localStorage.getItem("totalDeslocamento")) || 0;
    let ped = Number(localStorage.getItem("totalPedagios")) || 0;

    let total = d + a + des + ped;

    let pagamento = q === "PrimeiraQuinzena"
        ? `Valor a Receber dia 10`
        : `Valor a Receber dia 25`;

    let html = `<div class="container">`;

    html += `<h3>${pagamento}</h3>`;

    html += `<div class="linha"><div class="desc">Total Diárias</div><div class="valor">${formatar(d)}</div></div>`;
    html += `<div class="linha"><div class="desc">Total Aluguel</div><div class="valor">${formatar(a)}</div></div>`;
    html += `<div class="linha"><div class="desc">Total Deslocamento (${km} KM)</div><div class="valor">${formatar(des)}</div></div>`;
    html += `<div class="linha"><div class="desc">Total Pedágios</div><div class="valor">${formatar(ped)}</div></div>`;

    html += `<hr>`;

    html += `<div class="linha"><div class="desc"><strong>Total</strong></div><div class="valor"><strong>${formatar(total)}</strong></div></div>`;

    html += `</div>`;

    document.body.innerHTML = html;
}

window.onload = carregar;
</script>

</head>
<body>
</body>
</html>
