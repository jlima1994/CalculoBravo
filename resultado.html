<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family: monospace;
background:#000;
color:#0f0;
padding:20px;
white-space:pre;
}
button{
width:100%;
padding:15px;
margin-top:20px;
font-size:18px;
}
</style>
</head>

<body>

<div id="topo"></div>

<br>

<div id="res"></div>

<button onclick="copiar()">COPIAR RESENHA</button>

<script>
const r = JSON.parse(localStorage.getItem("resultado") || localStorage.getItem("dados"));

function f(v){ return (v||0).toFixed(2).padStart(10); }

const meses = [
"Janeiro","Fevereiro","Março","Abril","Maio","Junho",
"Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

let idx = meses.indexOf(r.mes);
let proxMes = meses[(idx + 1) % 12];

// 🔥 PAGAMENTO (SUBSTITUI RESULTADO FINAL)
let textoTopo = (r.dia == "10")
? `PAGAMENTO A SER REALIZADO DIA 10 DE ${proxMes.toUpperCase()}`
: `PAGAMENTO A SER REALIZADO DIA 25 DE ${proxMes.toUpperCase()}`;

document.getElementById("topo").innerText = textoTopo;

// valores padrão (caso segurança)
let totalDiarias = r.totalDiarias || 0;
let totalAluguel = r.totalAluguel || 0;
let totalDeslocamento = r.totalDeslocamento || 0;
let totalPed = r.totalPed || 0;
let qtd = r.qtd || 0;
let km = r.totalKm || 0;

let totalFinal = totalDiarias + totalAluguel + totalDeslocamento + totalPed;

let linhas = [];

// 🔥 OCULTA ZERO
if(totalDiarias > 0){
linhas.push(`R$ ${f(totalDiarias)}  TOTAL DIÁRIAS (${qtd})`);
}

if(totalAluguel > 0){
linhas.push(`R$ ${f(totalAluguel)}  TOTAL ALUGUEL (${qtd})`);
}

if(totalDeslocamento > 0){
linhas.push(`R$ ${f(totalDeslocamento)}  TOTAL DESLOCAMENTO (${km} KM)`);
}

if(totalPed > 0){
linhas.push(`R$ ${f(totalPed)}  TOTAL PEDÁGIOS`);
}

// total
linhas.push("");
linhas.push(`R$ ${f(totalFinal)}  TOTAL GERAL`);

document.getElementById("res").innerText = linhas.join("\n");

// copiar
function copiar(){
navigator.clipboard.writeText(
document.getElementById("topo").innerText + "\n\n" +
document.getElementById("res").innerText
);
alert("COPIADO!");
}
</script>

</body>
</html>
