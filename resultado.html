<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultado</title>

<style>
body { font-family: Arial; background:#f2f2f2; padding:10px; }
.container { max-width:500px; margin:auto; background:#fff; padding:15px; border-radius:10px; }

.topo { margin-bottom:10px; font-size:14px; }

.result {
    font-family: monospace;
    white-space: pre;
}
</style>
</head>

<body>
<div class="container">

<h2>RESULTADO FINAL</h2>

<div class="topo" id="topo"></div>
<div class="result" id="res"></div>

</div>

<script>
const r = JSON.parse(localStorage.getItem("resultado"));

function f(v){ return v.toFixed(2).padStart(10); }

const meses = [
"Janeiro","Fevereiro","Março","Abril","Maio","Junho",
"Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

let proxMes = meses[(meses.indexOf(r.mes) + 1) % 12];

let topo = (r.dia == "10")
? `Pagamento a ser realizado dia 10 de ${proxMes}`
: `Pagamento a ser realizado dia 25 de ${proxMes}`;

document.getElementById("topo").innerText = topo;

const totalFinal = r.totalDiarias + r.totalAluguel + r.totalDeslocamento + r.totalPed;

let linhas = [];

if(r.totalDiarias > 0){
    linhas.push(`R$ ${f(r.totalDiarias)}  TOTAL DIÁRIAS (${r.qtd})`);
}

if(r.totalAluguel > 0){
    linhas.push(`R$ ${f(r.totalAluguel)}  TOTAL ALUGUEL (${r.qtd})`);
}

if(r.totalDeslocamento > 0){
    linhas.push(`R$ ${f(r.totalDeslocamento)}  TOTAL DESLOCAMENTO (${r.totalKm} KM)`);
}

if(r.totalPed > 0){
    linhas.push(`R$ ${f(r.totalPed)}  TOTAL PEDÁGIOS`);
}

linhas.push("");
linhas.push(`R$ ${f(totalFinal)}  VALOR A RECEBER DIA ${r.dia}`);

document.getElementById("res").innerText = linhas.join("\n");
</script>

</body>
</html>
