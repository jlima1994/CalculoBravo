<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESULTADO</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    padding:20px;
}

h2{
    text-align:center;
    color:#00c853;
}

.item{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<h2 id="total"></h2>

<div id="diariasBox" class="item"></div>
<div id="aluguelBox" class="item"></div>
<div id="kmBox" class="item"></div>
<div id="pedagioBox" class="item"></div>

<script>

function moeda(v){
return "R$ " + v.toFixed(2).replace(".",",");
}

let diarias = Number(localStorage.getItem("diarias")) || 0;
let aluguel = Number(localStorage.getItem("aluguel")) || 0;
let km = Number(localStorage.getItem("deslocamento")) || 0;
let totalKm = Number(localStorage.getItem("totalKm")) || 0;
let pedagio = Number(localStorage.getItem("pedagios")) || 0;
let totalFinal = Number(localStorage.getItem("totalFinal")) || 0;

// CABEÇALHO
document.getElementById("total").innerText =
"RECEBERÁ " + moeda(totalFinal);

// DIARIAS
if(diarias > 0){
document.getElementById("diariasBox").innerHTML =
`<span>DIÁRIAS (${localStorage.getItem("qtdServicos")})</span><span>${moeda(diarias)}</span>`;
}else{
diariasBox.classList.add("hidden");
}

// ALUGUEL
if(aluguel > 0){
document.getElementById("aluguelBox").innerHTML =
`<span>ALUGUEL (${localStorage.getItem("qtdServicos")})</span><span>${moeda(aluguel)}</span>`;
}else{
aluguelBox.classList.add("hidden");
}

// KM
if(km > 0){
document.getElementById("kmBox").innerHTML =
`<span>DESLOCAMENTO (${totalKm} KM)</span><span>${moeda(km)}</span>`;
}else{
kmBox.classList.add("hidden");
}

// PEDAGIO
if(pedagio > 0){
document.getElementById("pedagioBox").innerHTML =
`<span>PEDÁGIOS</span><span>${moeda(pedagio)}</span>`;
}else{
pedagioBox.classList.add("hidden");
}

</script>

</body>
</html>
