<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
body{
    font-family: Arial;
    text-align:center;
}
</style>
</head>

<body>

<h3 id="topo"></h3>

<pre id="res"></pre>

<script>
const r = JSON.parse(localStorage.getItem("resultado") || localStorage.getItem("dados"));

function f(v){ return (v||0).toFixed(2); }

// mês seguinte
const meses = [
"Janeiro","Fevereiro","Março","Abril","Maio","Junho",
"Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
];

let prox = meses[(meses.indexOf(r.mes)+1)%12];

// topo pagamento
topo.innerText = (r.dia=="10")
? `Pagamento dia 10 de ${prox}`
: `Pagamento dia 25 de ${prox}`;

// valores
let td = r.totalDiarias||0;
let ta = r.totalAluguel||0;
let km = r.totalDeslocamento||0;
let tp = r.totalPed||0;

let qtdD = r.qtdDiarias||0;
let qtdA = r.qtdAluguel||0;
let kmReal = r.km||0;

let total = td+ta+km+tp;

let linhas=[];

// oculta zero
if(td>0) linhas.push(`R$ ${f(td)} DIÁRIAS (${qtdD})`);
if(ta>0) linhas.push(`R$ ${f(ta)} ALUGUEL (${qtdA})`);
if(km>0) linhas.push(`R$ ${f(km)} KM (${kmReal})`);
if(tp>0) linhas.push(`R$ ${f(tp)} PEDÁGIO`);

linhas.push("");
linhas.push(`R$ ${f(total)} TOTAL`);

res.innerText = linhas.join("\n");
</script>

</body>
</html>
