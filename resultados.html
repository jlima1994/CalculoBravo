<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>RESULTADOS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    padding: 10px;
}

/* CONTAINER PADRÃO */
.box, .container {
    width: 100%;
    max-width: 420px;
    margin: auto;
    text-align: center;
}

/* INPUTS E SELECT */
select, input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    font-size: 16px;
}

/* BOTÃO */
button {
    background: #00c853;
    border: none;
    color: white;
}

/* TABELA */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th {
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid #444;
}

td {
    padding: 8px;
}

/* ALINHAMENTOS */
.desc {
    text-align: left;
    white-space: nowrap;
}

.valor {
    text-align: right;
    white-space: nowrap;
}

/* INPUT NUMÉRICO */
input {
    text-align: right;
}
</style>
</head>

<body>

<div class="box">

<h2 id="titulo"></h2>

<table>
<thead>
<tr>
<th colspan="2">VALORES</th>
</tr>
</thead>

<tbody id="tabela"></tbody>

</table>

<button onclick="voltar()">VOLTAR</button>

</div>

<script>
function moeda(v) {
    return Number(v).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

const diarias = parseFloat(localStorage.getItem("diarias")) || 0;
const aluguel = parseFloat(localStorage.getItem("aluguel")) || 0;
const km = parseFloat(localStorage.getItem("km")) || 0;
const pedagios = parseFloat(localStorage.getItem("pedagios")) || 0;

const mes = localStorage.getItem("mes") || "";
const quinzena = localStorage.getItem("quinzena") || "";

const tabela = document.getElementById("tabela");

// adiciona linha só se valor > 0
function add(nome, valor) {
    if (valor > 0) {
        tabela.innerHTML += `
        <tr>
            <td class="desc">${nome}</td>
            <td class="valor">${moeda(valor)}</td>
        </tr>`;
    }
}

add("DIÁRIAS", diarias);
add("ALUGUEL", aluguel);
add("DESLOCAMENTO", km);
add("PEDÁGIOS", pedagios);

// TOTAL
const total = diarias + aluguel + km + pedagios;

tabela.innerHTML += `
<tr>
    <td class="desc"><b>TOTAL</b></td>
    <td class="valor"><b>${moeda(total)}</b></td>
</tr>
`;

// título
const meses = [
"JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO",
"JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"
];

let indice = meses.indexOf(mes);
let mesSeguinte = meses[(indice + 1) % 12];

let regra = "";

if (quinzena === "PRIMEIRA") {
    regra = `10 DE ${mesSeguinte}`;
} else {
    regra = `25 DE ${mesSeguinte}`;
}

document.getElementById("titulo").innerText =
`VOCÊ RECEBERA EM ${regra} O VALOR DE R$ ${moeda(total)}`;

function voltar() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
