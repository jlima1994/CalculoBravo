<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Valor a Receber</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
}

.container {
    margin-top: 60px;
}

select {
    padding: 10px;
    width: 220px;
    font-size: 16px;
    margin: 10px;
}

.box {
    display: inline-block;
    padding: 15px 25px;
    margin: 10px;
    border: 2px solid #333;
    cursor: pointer;
}

.selected {
    background: #333;
    color: white;
}

button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 16px;
}
</style>

<script>
let periodo = "";
let funcao = "";

function selecionarPeriodo(p) {
    periodo = p;
    document.getElementById("p1").classList.remove("selected");
    document.getElementById("p2").classList.remove("selected");
    document.getElementById("p"+p).classList.add("selected");
}

function selecionarFuncao(f) {
    funcao = f;
    document.getElementById("motorista").classList.remove("selected");
    document.getElementById("seguranca").classList.remove("selected");
    document.getElementById(f).classList.add("selected");
}

function avancar() {
    let mes = document.getElementById("mes").value;
    let qtd = document.getElementById("qtd").value;

    if (!mes || !periodo || !funcao) {
        alert("Preencha tudo");
        return;
    }

    localStorage.setItem("mes", mes);
    localStorage.setItem("periodo", periodo);
    localStorage.setItem("funcao", funcao);
    localStorage.setItem("qtd", qtd);

    if (funcao === "motorista") {
        window.location.href = "pagina2.html";
    } else {
        window.location.href = "resultado.html";
    }
}
</script>

</head>
<body>

<div class="container">

<h2>VALOR A RECEBER</h2>

<select id="mes">
<option value="">Selecione o mês</option>
<option>Janeiro</option>
<option>Fevereiro</option>
<option>Março</option>
<option>Abril</option>
<option>Maio</option>
<option>Junho</option>
<option>Julho</option>
<option>Agosto</option>
<option>Setembro</option>
<option>Outubro</option>
<option>Novembro</option>
<option>Dezembro</option>
</select>

<br>

<div id="p1" class="box" onclick="selecionarPeriodo(1)">1 a 15</div>
<div id="p2" class="box" onclick="selecionarPeriodo(2)">16 a 31</div>

<br>

<div id="motorista" class="box" onclick="selecionarFuncao('motorista')">Motorista</div>
<div id="seguranca" class="box" onclick="selecionarFuncao('seguranca')">Segurança</div>

<br>

<select id="qtd">
<option value="">Qtd Serviços</option>
<script>
for (let i=1;i<=30;i++){
document.write(`<option value="${i}">${i}</option>`)
}
</script>
</select>

<br>

<button onclick="avancar()">Avançar</button>

</div>

</body>
</html>
