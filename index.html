<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INÍCIO</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    color:#fff;
    font-family:Arial;
}

.container{
    width:90%;
    max-width:400px;
    text-align:center;
}

select, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
}

button{
    background:#00c853;
    border:none;
    color:#fff;
}
</style>
</head>

<body>

<div class="container">

<h2>SISTEMA</h2>

<select id="mes">
<option value="">MÊS</option>
<option>JANEIRO</option>
<option>FEVEREIRO</option>
<option>MARÇO</option>
<option>ABRIL</option>
<option>MAIO</option>
<option>JUNHO</option>
<option>JULHO</option>
<option>AGOSTO</option>
<option>SETEMBRO</option>
<option>OUTUBRO</option>
<option>NOVEMBRO</option>
<option>DEZEMBRO</option>
</select>

<select id="quinzena">
<option value="">QUINZENA</option>
<option>PRIMEIRA</option>
<option>SEGUNDA</option>
</select>

<select id="funcao">
<option value="">FUNÇÃO</option>
<option value="motorista">MOTORISTA</option>
<option value="seguranca">SEGURANÇA</option>
</select>

<select id="qtd">
<option value="">SERVIÇOS</option>
<script>
for(let i=1;i<=30;i++){
document.write(`<option value="${i}">${i}</option>`);
}
</script>
</select>

<button onclick="avancar()">AVANÇAR</button>

</div>

<script>
function avancar(){

let mes = mes.value;
let quinzena = quinzena.value;
let funcao = funcao.value;
let qtdServicos = Number(qtd.value);

if(!mes || !quinzena || !funcao || !qtdServicos){
alert("PREENCHA TUDO");
return;
}

localStorage.clear();

localStorage.setItem("mes", mes);
localStorage.setItem("quinzena", quinzena);
localStorage.setItem("funcao", funcao);
localStorage.setItem("qtdServicos", qtdServicos);

// SEGURANÇA → CALCULA DIRETO
if(funcao === "seguranca"){
let total = qtdServicos * 190;

localStorage.setItem("diarias", total);
localStorage.setItem("totalFinal", total);

window.location.href = "resultado.html";
return;
}

// MOTORISTA → PAGINA 2
window.location.href = "pagina2.html";
}
</script>

</body>
</html>
