<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÁLCULO BRAVO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #111;
    color: white;
    padding: 10px;
}

/* CONTAINER PADRÃO */
.box, .container {
    width: 100%;
    max-width: 420px;
    margin: auto;
    text-align: center;
}

/* INPUTS E SELECT */
select, input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    font-size: 16px;
}

/* BOTÃO */
button {
    background: #00c853;
    border: none;
    color: white;
}

/* TABELA */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th {
    text-align: center;
    padding: 10px;
    border-bottom: 1px solid #444;
}

td {
    padding: 8px;
}

/* ALINHAMENTOS */
.desc {
    text-align: left;
    white-space: nowrap;
}

.valor {
    text-align: right;
    white-space: nowrap;
}

/* INPUT NUMÉRICO */
input {
    text-align: right;
}
</style>
</head>

<body>

<div class="box">

<h2>CÁLCULO BRAVO</h2>

<select id="mes">
<option value="">MÊS</option>
<option>JANEIRO</option>
<option>FEVEREIRO</option>
<option>MARÇO</option>
<option>ABRIL</option>
<option>MAIO</option>
<option>JUNHO</option>
<option>JULHO</option>
<option>AGOSTO</option>
<option>SETEMBRO</option>
<option>OUTUBRO</option>
<option>NOVEMBRO</option>
<option>DEZEMBRO</option>
</select>

<select id="quinzena">
<option value="">QUINZENA</option>
<option>PRIMEIRA</option>
<option>SEGUNDA</option>
</select>

<select id="funcao">
<option value="">FUNÇÃO</option>
<option value="motorista">MOTORISTA</option>
<option value="seguranca">SEGURANÇA</option>
</select>

<select id="qtd"></select>

<button onclick="ir()">AVANÇAR</button>

</div>

<script>
// cria quantidade 1 a 30
const qtd = document.getElementById("qtd");
qtd.innerHTML = '<option value="">QTD SERVIÇOS</option>';

for (let i = 1; i <= 30; i++) {
    qtd.innerHTML += `<option value="${i}">${i}</option>`;
}

function ir() {
    const mes = document.getElementById("mes").value;
    const quinzena = document.getElementById("quinzena").value;
    const funcao = document.getElementById("funcao").value;
    const quantidade = document.getElementById("qtd").value;

    if (!mes || !quinzena || !funcao || !quantidade) {
        alert("PREENCHA TODOS OS CAMPOS");
        return;
    }

    // salvar
    localStorage.setItem("mes", mes);
    localStorage.setItem("quinzena", quinzena);
    localStorage.setItem("funcao", funcao);
    localStorage.setItem("qtd", quantidade);

    // fluxo
    if (funcao === "motorista") {
        window.location.href = "pagina2.html";
    } else {
        // segurança vai direto
        const diarias = quantidade * 190;

        localStorage.setItem("diarias", diarias);
        localStorage.setItem("aluguel", 0);
        localStorage.setItem("km", 0);
        localStorage.setItem("pedagios", 0);

        window.location.href = "resultados.html";
    }
}
</script>

</body>
</html>
