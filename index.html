<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INÍCIO</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:20px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:10px;
}

select, input{
    width:100%;
    padding:10px;
    margin-top:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#00c853;
    border:none;
    color:#fff;
    font-size:16px;
}
</style>
</head>

<body>

<h1>SISTEMA DE CÁLCULO</h1>

<label>MÊS</label>
<select id="mes">
<option value="">SELECIONE</option>
<option>JANEIRO</option>
<option>FEVEREIRO</option>
<option>MARÇO</option>
<option>ABRIL</option>
<option>MAIO</option>
<option>JUNHO</option>
<option>JULHO</option>
<option>AGOSTO</option>
<option>SETEMBRO</option>
<option>OUTUBRO</option>
<option>NOVEMBRO</option>
<option>DEZEMBRO</option>
</select>

<label>QUINZENA</label>
<select id="quinzena">
<option value="">SELECIONE</option>
<option>PRIMEIRA</option>
<option>SEGUNDA</option>
</select>

<label>FUNÇÃO</label>
<select id="funcao">
<option value="">SELECIONE</option>
<option value="motorista">MOTORISTA</option>
<option value="seguranca">SEGURANÇA</option>
</select>

<label>QUANTIDADE DE SERVIÇOS</label>
<input type="number" id="qtd" min="1">

<button onclick="avancar()">AVANÇAR</button>

<script>
function avancar(){

    let mes = document.getElementById("mes").value;
    let quinzena = document.getElementById("quinzena").value;
    let funcao = document.getElementById("funcao").value;
    let qtd = Number(document.getElementById("qtd").value);

    if(!mes || !quinzena || !funcao || !qtd){
        alert("PREENCHA TODOS OS CAMPOS");
        return;
    }

    // limpa tudo
    localStorage.clear();

    // salva base
    localStorage.setItem("mes", mes);
    localStorage.setItem("quinzena", quinzena);
    localStorage.setItem("funcao", funcao);
    localStorage.setItem("qtdServicos", qtd);

    // 🚗 MOTORISTA
    if(funcao === "motorista"){
        window.location.href = "pagina2.html";
        return;
    }

    // 🛡️ SEGURANÇA
    let totalFinal = qtd * 190;

    localStorage.setItem("totalFinal", totalFinal);

    window.location.href = "resultado.html";
}
</script>

</body>
</html>
