<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início</title>

<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
}

.container {
    width: 320px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    font-size: 16px;
}

button {
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #333;
}
</style>

<script>
function continuar(){

    let tipo = document.getElementById("tipoUsuario").value;

    if(!tipo){
        alert("SELECIONE UMA OPÇÃO");
        return;
    }

    // salva escolha
    localStorage.setItem("tipoUsuario", tipo);

    // limpa dados antigos (opcional mas recomendado)
    localStorage.removeItem("totalDiarias");
    localStorage.removeItem("totalAluguel");
    localStorage.removeItem("totalKm");
    localStorage.removeItem("totalDeslocamento");
    localStorage.removeItem("totalPedagios");

    // fluxo
    if(tipo === "motorista"){
        window.location.href = "pagina2.html";
    } else {
        window.location.href = "outraPagina.html";
    }
}
</script>

</head>
<body>

<div class="container">

    <h2>INICIAR PROCESSO</h2>

    <select id="tipoUsuario">
        <option value="">SELECIONE O TIPO</option>
        <option value="motorista">MOTORISTA</option>
        <option value="outro">OUTRO</option>
    </select>

    <button onclick="continuar()">CONTINUAR</button>

</div>

</body>
</html>
