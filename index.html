<!-- CSS ADICIONE/ATUALIZE -->

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
}

.container {
    padding: 15px;
    max-width: 500px;
    margin: auto;
}

h2 {
    text-align: center;
}

/* CAMPOS */
select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* BOTÃO */
button {
    width: 100%;
    padding: 14px;
    background: #000;
    color: #fff;
    border: none;
    font-size: 16px;
    border-radius: 10px;
}

/* GRUPOS MODERNOS */
.opcoes {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.opcao {
    flex: 1;
}

.opcao input {
    display: none;
}

.opcao label {
    display: block;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #ccc;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

/* SELECIONADO */
.opcao input:checked + label {
    background: #000;
    color: #fff;
    border-color: #000;
}

/* MOBILE AJUSTE */
@media (max-width: 400px) {
    .opcoes {
        flex-direction: column;
    }
}
</style>
