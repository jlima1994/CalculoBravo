<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial;
    text-align: center;
}

select{
    width: 80%;
    padding: 10px;
}

.box{
    border: 2px solid #000;
    padding: 15px;
    margin: 8px auto;
    width: 80%;
    cursor: pointer;
}

.selected{
    background: #000;
    color: #fff;
}

button{
    margin-top:20px;
    padding:15px;
    width:80%;
}
</style>
</head>

<body>

<h3>MÊS</h3>
<select id="mes">
<option value="">Selecione</option>
<option>Janeiro</option>
<option>Fevereiro</option>
<option>Março</option>
<option>Abril</option>
<option>Maio</option>
<option>Junho</option>
<option>Julho</option>
<option>Agosto</option>
<option>Setembro</option>
<option>Outubro</option>
<option>Novembro</option>
<option>Dezembro</option>
</select>

<h3>PERÍODO</h3>
<div class="box" onclick="sel('dia','10',this)">1 A 15</div>
<div class="box" onclick="sel('dia','25',this)">16 A 31</div>

<h3>FUNÇÃO</h3>
<div class="box" onclick="sel('funcao','motorista',this)">MOTORISTA</div>
<div class="box" onclick="sel('funcao','seguranca',this)">SEGURANÇA</div>

<button onclick="go()">CONTINUAR</button>

<script>
let dados = {};

function sel(tipo, valor, el){
    dados[tipo] = valor;

    document.querySelectorAll('.box').forEach(b=>{
        if(b.getAttribute("onclick").includes(tipo)){
            b.classList.remove("selected");
        }
    });

    el.classList.add("selected");
}

function go(){
    let mes = document.getElementById("mes").value;

    if(!mes || !dados.dia || !dados.funcao){
        alert("Preencha tudo");
        return;
    }

    localStorage.setItem("dados", JSON.stringify({
        mes,
        dia: dados.dia,
        funcao: dados.funcao
    }));

    if(dados.funcao === "motorista"){
        location = "pagina2.html";
    }else{
        location = "resultado.html";
    }
}
</script>

</body>
</html>
