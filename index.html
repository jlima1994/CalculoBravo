<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA</title>

<style>
body{
font-family: monospace;
background:#000;
color:#0f0;
padding:20px;
}
select, button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
}
</style>
</head>

<body>

<h2>MÊS</h2>
<select id="mes">
<option>Janeiro</option>
<option>Fevereiro</option>
<option>Março</option>
<option>Abril</option>
<option>Maio</option>
<option>Junho</option>
<option>Julho</option>
<option>Agosto</option>
<option>Setembro</option>
<option>Outubro</option>
<option>Novembro</option>
<option>Dezembro</option>
</select>

<h2>PERÍODO</h2>
<select id="periodo">
<option value="10">1 A 15</option>
<option value="25">16 A 31</option>
</select>

<h2>FUNÇÃO</h2>
<select id="funcao">
<option value="motorista">MOTORISTA</option>
<option value="seguranca">SEGURANÇA</option>
</select>

<button onclick="ir()">CONTINUAR</button>

<script>
function ir(){
const funcao = document.getElementById("funcao").value;

localStorage.setItem("dados", JSON.stringify({
mes: document.getElementById("mes").value,
dia: document.getElementById("periodo").value,
funcao
}));

if(funcao === "motorista"){
window.location = "pagina2.html";
}else{
window.location = "resultado.html";
}
}
</script>

</body>
</html>
