<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcular Quinzena</title>

<style>
body { font-family: Arial; background:#f2f2f2; padding:10px; }
.container { max-width:500px; margin:auto; background:#fff; padding:15px; border-radius:10px; }

.box {
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

h3 { margin-bottom:5px; }

.select-group {
    display:flex;
    gap:5px;
}

.select-group label {
    flex:1;
    text-align:center;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    cursor:pointer;
    background:#f9f9f9;
}

.select-group input { display:none; }

.select-group input:checked + label {
    background:#007bff;
    color:#fff;
    border-color:#007bff;
}

select, button {
    width:100%;
    padding:8px;
    margin-top:5px;
}

button {
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:5px;
}
</style>
</head>

<body>
<div class="container">

<h2>CALCULAR QUINZENA</h2>

<div class="box">
<h3>MÊS</h3>
<select id="mes">
<option>Janeiro</option><option>Fevereiro</option><option>Março</option>
<option>Abril</option><option>Maio</option><option>Junho</option>
<option>Julho</option><option>Agosto</option><option>Setembro</option>
<option>Outubro</option><option>Novembro</option><option>Dezembro</option>
</select>
</div>

<div class="box">
<h3>QUINZENA</h3>
<div class="select-group">
    <input type="radio" id="q1" name="quinzena" value="10">
    <label for="q1">01–15</label>

    <input type="radio" id="q2" name="quinzena" value="25">
    <label for="q2">16–31</label>
</div>
</div>

<div class="box">
<h3>FUNÇÃO</h3>
<div class="select-group">
    <input type="radio" id="f1" name="funcao" value="motorista">
    <label for="f1">Motorista</label>

    <input type="radio" id="f2" name="funcao" value="seguranca">
    <label for="f2">Segurança</label>
</div>
</div>

<div class="box">
<h3>QUANTIDADE DE SERVIÇOS</h3>
<select id="qtd">
<option value="">Selecione</option>
<script>
for(let i=1;i<=30;i++){
document.write(`<option value="${i}">${i}</option>`);
}
</script>
</select>
</div>

<button onclick="proximo()">PRÓXIMO</button>

</div>

<script>
function proximo(){
    const dados = {
        mes: document.getElementById('mes').value,
        quinzena: document.querySelector('input[name="quinzena"]:checked')?.value,
        funcao: document.querySelector('input[name="funcao"]:checked')?.value,
        qtd: document.getElementById('qtd').value
    };

    localStorage.setItem("dados", JSON.stringify(dados));

    if(dados.funcao === "motorista"){
        window.location.href = "pagina2.html";
    } else {
        const resultado = {
            totalDiarias: dados.qtd * 190,
            totalAluguel: 0,
            totalDeslocamento: 0,
            totalPed: 0,
            totalKm: 0,
            dia: dados.quinzena,
            qtd: dados.qtd,
            mes: dados.mes
        };

        localStorage.setItem("resultado", JSON.stringify(resultado));
        window.location.href = "resultado.html";
    }
}
</script>

</body>
</html>
