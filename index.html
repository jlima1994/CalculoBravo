<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PREENCHIMENTO</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    text-align: center;
    padding: 20px;
}

table {
    width: 100%;
    max-width: 400px;
    margin: auto;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
}

th {
    text-align: center;
}

td input {
    width: 100%;
    padding: 8px;
    text-align: right;
}

button {
    margin-top: 20px;
    padding: 12px;
    width: 200px;
    background: #00c853;
    border: none;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<h2>PREENCHER DADOS</h2>

<table>
    <thead>
        <tr>
            <th>PEDÁGIOS (R$)</th>
            <th>KM</th>
        </tr>
    </thead>
    <tbody id="linhas"></tbody>
</table>

<button onclick="calcular()">CALCULAR</button>

<script>
const qtd = parseInt(localStorage.getItem("qtd")) || 0;
const container = document.getElementById("linhas");

// CRIA LINHAS DINAMICAMENTE
for (let i = 0; i < qtd; i++) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td><input type="number" step="0.01" placeholder="0.00" class="pedagio"></td>
        <td><input type="number" step="0.01" placeholder="0.00" class="km"></td>
    `;

    container.appendChild(tr);
}

function calcular() {
    let pedagios = 0;
    let km = 0;

    document.querySelectorAll(".pedagio").forEach(el => {
        pedagios += parseFloat(el.value) || 0;
    });

    document.querySelectorAll(".km").forEach(el => {
        km += parseFloat(el.value) || 0;
    });

    const qtdServ = parseInt(localStorage.getItem("qtd"));

    const valorKm = km * 0.68;
    const diarias = qtdServ * 190;
    const aluguel = qtdServ * 49.5;

    // SALVA RESULTADOS
    localStorage.setItem("pedagios", pedagios.toFixed(2));
    localStorage.setItem("km", valorKm.toFixed(2));
    localStorage.setItem("diarias", diarias.toFixed(2));
    localStorage.setItem("aluguel", aluguel.toFixed(2));

    window.location.href = "resultados.html";
}
</script>

</body>
</html>
