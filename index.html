<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CÁLCULO BRAVO</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    width: 300px;
}

select, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    font-size: 16px;
}

button {
    background: #00c853;
    border: none;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #00e676;
}
</style>
</head>

<body>

<div class="container">

<h2>CÁLCULO BRAVO</h2>

<select id="mes">
    <option value="">SELECIONE O MÊS</option>
    <option>JANEIRO</option>
    <option>FEVEREIRO</option>
    <option>MARÇO</option>
    <option>ABRIL</option>
    <option>MAIO</option>
    <option>JUNHO</option>
    <option>JULHO</option>
    <option>AGOSTO</option>
    <option>SETEMBRO</option>
    <option>OUTUBRO</option>
    <option>NOVEMBRO</option>
    <option>DEZEMBRO</option>
</select>

<select id="quinzena">
    <option value="">QUINZENA</option>
    <option>PRIMEIRA</option>
    <option>SEGUNDA</option>
</select>

<select id="funcao">
    <option value="">FUNÇÃO</option>
    <option value="motorista">MOTORISTA</option>
    <option value="seguranca">SEGURANÇA</option>
</select>

<select id="qtd">
    <option value="">QTD SERVIÇOS</option>
</select>

<button onclick="avancar()">AVANÇAR</button>

</div>

<script>
// Preenche quantidade de serviços
const selectQtd = document.getElementById("qtd");
for (let i = 1; i <= 30; i++) {
    let opt = document.createElement("option");
    opt.value = i;
    opt.text = i;
    selectQtd.appendChild(opt);
}

function avancar() {
    const mes = document.getElementById("mes").value;
    const quinzena = document.getElementById("quinzena").value;
    const funcao = document.getElementById("funcao").value;
    const qtd = document.getElementById("qtd").value;

    if (!mes || !quinzena || !funcao || !qtd) {
        alert("PREENCHA TODOS OS CAMPOS");
        return;
    }

    // SALVA DADOS
    localStorage.setItem("mes", mes);
    localStorage.setItem("quinzena", quinzena);
    localStorage.setItem("funcao", funcao);
    localStorage.setItem("qtd", qtd);

    // FLUXO
    if (funcao === "motorista") {
        window.location.href = "pagina2.html";
    } else {
        // SEGURANÇA → CALCULA DIRETO
        const total = qtd * 190;

        localStorage.setItem("diarias", total);
        localStorage.setItem("aluguel", 0);
        localStorage.setItem("km", 0);
        localStorage.setItem("pedagios", 0);

        window.location.href = "resultados.html";
    }
}
</script>

</body>
</html>
