<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valor a Receber</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 10px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

label {
    margin-top: 10px;
    display: block;
}

input, select {
    width: 100%;
    padding: 8px;
    margin-top: 3px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
}

.result {
    background: #fafafa;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    font-family: monospace;
    white-space: pre;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="container">

<h2>VALOR A RECEBER</h2>

<label>Data:</label> <input type="date" id="data">

<label>Quantidade de Serviços:</label> <select id="qtdServicos" onchange="gerarCampos()"> <option value="">Selecione</option> <option value="1">1 serviço</option> <option value="2">2 serviços</option> <option value="3">3 serviços</option> <option value="4">4 serviços</option> </select>

<div id="servicos"></div>

<label>Valor KM (R$):</label> <input type="number" id="valorKm" value="1.5">

<label>Total Pedágio (R$):</label> <input type="number" id="pedagio" value="0">

<button onclick="calcular()">CALCULAR</button>

<div class="result" id="resultado"></div>

</div>

<script>
function gerarCampos() {
    const qtd = document.getElementById('qtdServicos').value;
    const container = document.getElementById('servicos');
    container.innerHTML = '';

    for (let i = 1; i <= qtd; i++) {
        container.innerHTML += `
            <hr>
            <label>SERVIÇO ${i} (R$):</label>
            <input type="number" id="servico${i}" value="0">

            <label>KM ${i}:</label>
            <input type="number" id="km${i}" value="0">
        `;
    }
}

function formatarData(data) {
    if (!data) return '';
    const partes = data.split('-');
    return partes[2] + '/' + partes[1] + '/' + partes[0];
}

function calcular() {
    const qtd = document.getElementById('qtdServicos').value;
    const valorKm = parseFloat(document.getElementById('valorKm').value) || 0;
    const pedagio = parseFloat(document.getElementById('pedagio').value) || 0;
    const data = formatarData(document.getElementById('data').value);

    let totalServicos = 0;
    let totalKm = 0;

    for (let i = 1; i <= qtd; i++) {
        totalServicos += parseFloat(document.getElementById('servico'+i).value) || 0;
        totalKm += parseFloat(document.getElementById('km'+i).value) || 0;
    }

    const totalDeslocamento = totalKm * valorKm;
    const totalFinal = totalServicos + totalDeslocamento + pedagio;

    function f(v){
        return v.toFixed(2).padStart(10);
    }

    const texto =
`R$ ${f(totalServicos)}  TOTAL SERVIÇOS
R$ ${f(totalDeslocamento)}  TOTAL DESLOCAMENTO (KM)
R$ ${f(pedagio)}  TOTAL PEDÁGIOS

R$ ${f(totalFinal)}  VALOR A RECEBER ${data}`;

    document.getElementById('resultado').innerText = texto;
}
</script>

</body>
</html>
