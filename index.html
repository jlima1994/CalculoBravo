<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcular Quinzena</title>

<style>
body { font-family: Arial; background:#f2f2f2; padding:10px; }
.container { max-width:500px; margin:auto; background:#fff; padding:15px; border-radius:10px; }

.box {
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

h3 { margin:0 0 5px 0; font-size:16px; }

select, input, button {
    width:100%;
    padding:8px;
    margin-top:5px;
}

button {
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:5px;
}
</style>
</head>

<body>
<div class="container">

<h2>CALCULAR QUINZENA</h2>

<div class="box">
<h3>MÊS TRABALHADO</h3>
<select id="mes">
<option>Janeiro</option><option>Fevereiro</option><option>Março</option>
<option>Abril</option><option>Maio</option><option>Junho</option>
<option>Julho</option><option>Agosto</option><option>Setembro</option>
<option>Outubro</option><option>Novembro</option><option>Dezembro</option>
</select>
</div>

<div class="box">
<h3>QUINZENA</h3>
<input type="radio" name="quinzena" value="10"> 01 a 15<br>
<input type="radio" name="quinzena" value="25"> 16 a 31
</div>

<div class="box">
<h3>FUNÇÃO</h3>
<input type="radio" name="funcao" value="motorista"> Motorista<br>
<input type="radio" name="funcao" value="seguranca"> Segurança
</div>

<div class="box">
<h3>QUANTIDADE DE SERVIÇOS</h3>
<select id="qtd">
<option value="">Selecione</option>
<script>
for(let i=1;i<=30;i++){
document.write(`<option value="${i}">${i}</option>`);
}
</script>
</select>
</div>

<button onclick="proximo()">PRÓXIMO</button>

</div>

<script>
function proximo(){
    const dados = {
        mes: document.getElementById('mes').value,
        quinzena: document.querySelector('input[name="quinzena"]:checked')?.value,
        funcao: document.querySelector('input[name="funcao"]:checked')?.value,
        qtd: document.getElementById('qtd').value
    };

    localStorage.setItem("dados", JSON.stringify(dados));
    window.location.href = "pagina2.html";
}
</script>

</body>
</html>
