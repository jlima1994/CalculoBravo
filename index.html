<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Calcular Quinzena</title>

<style>
body {
    font-family: Arial;
    text-align: center;
}

.container {
    margin-top: 40px;
}

select, .box {
    width: 240px;
    margin: 8px auto;
    display: block;
    padding: 10px;
    font-size: 15px;
}

.box {
    border: 1px solid #000;
    cursor: pointer;
}

.selected {
    background: #000;
    color: #fff;
}
</style>

<script>
let quinzena = "";
let funcao = "";

function selQuinzena(valor, elemento){
    quinzena = valor;

    document.getElementById("q1").classList.remove("selected");
    document.getElementById("q2").classList.remove("selected");

    elemento.classList.add("selected");
}

function selFuncao(valor, elemento){
    funcao = valor;

    document.getElementById("motorista").classList.remove("selected");
    document.getElementById("seguranca").classList.remove("selected");

    elemento.classList.add("selected");
}

<script>
function avancar(){

    let mes = document.getElementById("mes").value;
    let quinzena = document.getElementById("quinzena").value;
    let funcao = document.getElementById("funcao").value;
    let qtd = document.getElementById("qtd").value;

    if(!mes || !quinzena || !funcao || !qtd){
        alert("PREENCHA TODOS OS CAMPOS");
        return;
    }

    // salvar dados básicos
    localStorage.setItem("mes", mes);
    localStorage.setItem("quinzena", quinzena);
    localStorage.setItem("funcao", funcao);
    localStorage.setItem("qtdServicos", qtd);

    // 🚗 MOTORISTA → vai pra página 2 normal
    if(funcao === "motorista"){
        window.location.href = "pagina2.html";
        return;
    }

    // 🛡️ SEGURANÇA → calcula direto aqui

    let totalPedagio = 0;
    let totalKm = 0;
    let valorKm = 0;

    // se quiser, pode adaptar aqui depois com outras regras de segurança

    // salvar igual página 2 faria
    localStorage.setItem("totalPedagio", totalPedagio);
    localStorage.setItem("totalKm", totalKm);
    localStorage.setItem("valorKm", valorKm);

    // ir direto pro resultado
    window.location.href = "resultado.html";
}
</script>
</script>

</head>
<body>

<div class="container">

<h2>Calcular Quinzena</h2>

<select id="mes">
<option value="">Mês Trabalhado</option>
<option>Janeiro</option><option>Fevereiro</option><option>Março</option>
<option>Abril</option><option>Maio</option><option>Junho</option>
<option>Julho</option><option>Agosto</option><option>Setembro</option>
<option>Outubro</option><option>Novembro</option><option>Dezembro</option>
</select>

<div id="q1" class="box" onclick="selQuinzena('PrimeiraQuinzena', this)">01 a 15</div>
<div id="q2" class="box" onclick="selQuinzena('SegundaQuinzena', this)">16 a 31</div>

<div id="motorista" class="box" onclick="selFuncao('motorista', this)">Motorista</div>
<div id="seguranca" class="box" onclick="selFuncao('seguranca', this)">Segurança</div>

<select id="qtd">
<option value="">Qtd Serviços</option>
<script>
for(let i=1;i<=30;i++){
document.write(`<option value="${i}">${i}</option>`)
}
</script>
</select>

<button onclick="avancar()">Avançar</button>

</div>

</body>
</html>
